; Ajustes de PHP para el contenedor de la aplicación.
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
expose_php = Off

; Logs a stderr (Twelve-Factor): docker compose logs los recoge.
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 128
